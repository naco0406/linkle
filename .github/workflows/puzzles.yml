# 문제 채우기: 위키백과 덤프로 링크 지도를 만들어
#   오늘의 문제 대기열에 40개, 커뮤니티의 "링클이 낸 문제"에 8개, 같이 달리기의 랜덤 풀에 40개를 넣는다.
# 달력에 맞춰 돌지 않는다. Worker가 매시 대기열을 보고 10개 아래로 줄면 이 작업을 부른다(apps/worker/src/refill.ts).
#   부르는 열쇠는 Worker 비밀값 GITHUB_DISPATCH_TOKEN(이 저장소의 Actions 읽기·쓰기 권한만 가진 토큰)이다.
#   밖에서 부르는 실행이라 GitHub의 "60일 동안 활동이 없으면 예약 실행을 멈춘다" 규칙에 걸리지 않는다.
# 출제는 Worker가 매일 대기열에서 하나씩 꺼내 한다(apps/worker/src/schedule.ts). 이 작업은 넣기만 한다.
#
# 저장소가 공개라 실행 기록과 결과물을 누구나 본다. 그래서 문제 이름과 정답 경로는 기록에 찍지 않고(CI에서는 개수만),
# 만든 후보 파일도 결과물로 올리지 않는다. 넣은 문제는 관리자 화면(/admin)에서 확인한다.
#
# 쓰는 값 (저장소 Settings → Secrets and variables → Actions)
#   secrets.LINKLE_ADMIN_TOKEN  Worker의 관리용 API 열쇠(Worker 비밀값 ADMIN_TOKEN과 같은 값)
#   vars.LINKLE_URL             서비스 주소
#   vars.WIKI_USER_AGENT        (선택) 연락처가 담긴 User-Agent. 있으면 위키백과 요청 제한이 넉넉해져 빨리 끝난다
name: 문제 채우기

on:
  # Worker가 부르거나, Actions 화면에서 손으로 돌린다
  workflow_dispatch:
    inputs:
      daily:
        description: 오늘의 문제 대기열에 넣을 수
        default: '40'
      official:
        description: 커뮤니티에 올릴 수
        default: '8'
      random:
        description: 같이 달리기 랜덤 풀에 넣을 수
        default: '40'

# 두 번 불려도 한 번에 하나씩만 돈다. 같은 문제를 겹쳐 넣지 않게
concurrency:
  group: fill-puzzles
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LINKLE_URL: ${{ vars.LINKLE_URL }}
      LINKLE_ADMIN_TOKEN: ${{ secrets.LINKLE_ADMIN_TOKEN }}
      WIKI_USER_AGENT: ${{ vars.WIKI_USER_AGENT }}
      WIKI_INTERVAL_MS: ${{ vars.WIKI_USER_AGENT && '1500' || '6500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 덤프 받기 (약 540 MB)
        run: pnpm --filter puzzle-gen download
      - name: 링크 지도 만들기
        run: pnpm --filter puzzle-gen build-graph

      - name: 이미 쓴 문서 받기
        run: pnpm --filter puzzle-gen used
      - name: 오늘의 문제 후보 만들기
        if: ${{ (inputs.daily || '40') != '0' }}
        run: pnpm --filter puzzle-gen generate --count ${{ inputs.daily || '40' }} --minutes 165 --exclude out/used.txt
      - name: 오늘의 문제 대기열에 넣기
        if: ${{ (inputs.daily || '40') != '0' }}
        run: pnpm --filter puzzle-gen upload --pool daily

      - name: 이미 쓴 문서 다시 받기
        run: pnpm --filter puzzle-gen used
      - name: 커뮤니티 문제 만들기
        if: ${{ (inputs.official || '8') != '0' }}
        run: pnpm --filter puzzle-gen generate --pool official --count ${{ inputs.official || '8' }} --minutes 45 --exclude out/used.txt
      - name: 커뮤니티에 올리기
        if: ${{ (inputs.official || '8') != '0' }}
        run: pnpm --filter puzzle-gen upload --pool official

      - name: 이미 쓴 문서 다시 받기
        run: pnpm --filter puzzle-gen used
      - name: 같이 달리기 랜덤 문제 만들기
        if: ${{ (inputs.random || '40') != '0' }}
        run: pnpm --filter puzzle-gen generate --pool random --count ${{ inputs.random || '40' }} --minutes 70 --exclude out/used.txt
      - name: 랜덤 풀에 넣기
        if: ${{ (inputs.random || '40') != '0' }}
        run: pnpm --filter puzzle-gen upload --pool random
