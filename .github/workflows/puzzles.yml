# 문제 채우기: 한 달에 한 번, 위키백과 덤프로 링크 지도를 만들어
#   오늘의 문제 대기열에 40개, 커뮤니티의 "링클이 낸 문제"에 8개를 넣는다.
# 출제는 Worker가 매일 대기열에서 하나씩 꺼내 한다(apps/worker/src/schedule.ts). 이 작업은 넣기만 한다.
#
# 쓰는 값 (저장소 Settings → Secrets and variables → Actions)
#   secrets.LINKLE_ADMIN_TOKEN  Worker의 관리용 API 열쇠(Worker 비밀값 ADMIN_TOKEN과 같은 값)
#   vars.LINKLE_URL             서비스 주소
#   vars.WIKI_USER_AGENT        (선택) 연락처가 담긴 User-Agent. 있으면 위키백과 요청 제한이 넉넉해져 빨리 끝난다
name: 문제 채우기

on:
  schedule:
    # 매달 3일 03:00 KST. 위키백과 덤프는 매달 1일 무렵 새로 나온다
    - cron: '0 18 2 * *'
  workflow_dispatch:
    inputs:
      daily:
        description: 오늘의 문제 대기열에 넣을 수
        default: '40'
      official:
        description: 커뮤니티에 올릴 수
        default: '8'

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LINKLE_URL: ${{ vars.LINKLE_URL }}
      LINKLE_ADMIN_TOKEN: ${{ secrets.LINKLE_ADMIN_TOKEN }}
      WIKI_USER_AGENT: ${{ vars.WIKI_USER_AGENT }}
      WIKI_INTERVAL_MS: ${{ vars.WIKI_USER_AGENT && '1500' || '6500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 덤프 받기 (약 540 MB)
        run: pnpm --filter puzzle-gen download
      - name: 링크 지도 만들기
        run: pnpm --filter puzzle-gen build-graph

      - name: 이미 쓴 문서 받기
        run: pnpm --filter puzzle-gen used
      - name: 오늘의 문제 후보 만들기
        run: pnpm --filter puzzle-gen generate --count ${{ inputs.daily || '40' }} --exclude out/used.txt
      - name: 오늘의 문제 대기열에 넣기
        run: pnpm --filter puzzle-gen upload --pool daily

      - name: 이미 쓴 문서 다시 받기
        run: pnpm --filter puzzle-gen used
      - name: 커뮤니티 문제 만들기
        run: pnpm --filter puzzle-gen generate --pool official --count ${{ inputs.official || '8' }} --exclude out/used.txt
      - name: 커뮤니티에 올리기
        run: pnpm --filter puzzle-gen upload --pool official

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-candidates
          path: tools/puzzle-gen/out/
